[project]
name = "crypto-market-intel-agent"
version = "0.1.0"
description = "Crypto market event intelligence agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langchain>=0.3.0",
  "langchain-openai>=0.2.0",
  "pydantic>=2.8.0",
  "sqlalchemy>=2.0.0",
  "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/crypto_market_intel"]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
]
